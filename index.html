<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXO/WEB — Portafolio 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#111; --cream:#f0ebdf; --pink:#ff2d8f; --lime:#c5f534; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:"Space Mono",monospace}
  html{background:#06080f}            /* fallback oscuro */
  body{background:transparent}        /* transparente: deja ver el fondo animado (bgfx z-index:-1) */
  #app{position:fixed;inset:0}
  canvas{display:block;cursor:grab}
  canvas:active{cursor:grabbing}

  /* Título de la empresa (estilo brutalista NEXO/WEB) */
  .brand-title{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:3;
    display:flex;align-items:center;gap:0;white-space:nowrap;max-width:96vw;
    font-family:"Archivo Black",sans-serif;font-size:clamp(15px,5vw,32px);letter-spacing:.01em;color:#eaf0ff}
  .brand-title .nx{background:#9a5aff;color:#fff;border:3px solid var(--ink);
    padding:.1em .42em;font-size:.78em;transform:rotate(-4deg);margin-right:.34em}  /* logo fucsia */
  .brand-title .nexo{color:#eaf0ff}                               /* NEXO claro */
  .brand-title .web{background:var(--lime);color:var(--ink);
    padding:.04em .32em;box-shadow:.1em .1em 0 var(--ink)} /* WEB pegado a NEXO- */

  /* Subtítulo debajo del título */
  .subtitle{position:fixed;top:138px;left:50%;transform:translateX(-50%);z-index:3;
    font-family:"Space Mono",monospace;font-weight:400;font-size:13px;letter-spacing:.06em;
    color:#aab4d8;white-space:nowrap}

  /* Bandera argentina (arriba del título, centrada) */
  .flag{position:fixed;top:30px;left:50%;transform:translateX(-50%);z-index:3;
    width:60px;height:40px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);
    overflow:hidden;line-height:0;background:#fff}
  .flag svg{width:100%;height:100%;display:block}

  /* Botón Ver portafolio */
  .portfolio-btn{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:3;
    font-family:"Space Mono",monospace;font-weight:700;font-size:16px;letter-spacing:.02em;
    background:linear-gradient(135deg,#5b6bff,#3df0ff);color:#06080f;border:none;
    box-shadow:0 0 22px rgba(60,240,255,.5), 0 8px 24px rgba(0,0,0,.4);border-radius:12px;
    padding:14px 28px;text-decoration:none;display:inline-flex;align-items:center;gap:10px;
    white-space:nowrap;                                  /* flecha en el mismo renglón */
    transition:transform .12s ease, box-shadow .12s ease}
  .portfolio-btn:hover{transform:translateX(-50%) translateY(-3px);box-shadow:0 0 32px rgba(60,240,255,.8), 0 10px 28px rgba(0,0,0,.5)}

  /* Subtítulo arriba del botón: invita a interactuar con el 3D */
  .play-hint{position:fixed;bottom:150px;left:50%;z-index:3;transform:translateX(-50%) rotate(-2deg);
    font-family:"Space Mono",monospace;font-weight:700;font-size:8px;letter-spacing:.08em;text-transform:uppercase;
    color:#06080f;background:#3df0ff;border:none;border-radius:999px;padding:3px 9px;box-shadow:0 0 12px rgba(60,240,255,.6);
    white-space:nowrap;animation:hintBob 2.6s ease-in-out infinite}
  @keyframes hintBob{0%,100%{transform:translateX(-50%) rotate(-2deg) translateY(0)}
    50%{transform:translateX(-50%) rotate(-2deg) translateY(-5px)}}

  /* Mobile: que el botón entre completo en un renglón */
  @media (max-width:480px){
    .portfolio-btn{font-size:14px;padding:12px 20px;bottom:64px;box-shadow:5px 5px 0 var(--ink)}
    .flag{top:22px;width:52px;height:35px}
    .brand-title{top:72px}
    .subtitle{top:112px;font-size:12px}
    .play-hint{bottom:116px;font-size:7.5px;padding:3px 6px}
  }

  /* Durante el "dive" se esconde la interfaz para entrar limpio al teléfono */
  body.diving .brand-title, body.diving .subtitle, body.diving .flag,
  body.diving .portfolio-btn, body.diving .play-hint{
    opacity:0 !important; pointer-events:none; transition:opacity .35s ease}

</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div class="flag" title="Argentina">
  <svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg">
    <rect width="30" height="20" fill="#fff"/>
    <rect width="30" height="6.667" y="0" fill="#74acdf"/>
    <rect width="30" height="6.667" y="13.333" fill="#74acdf"/>
    <circle cx="15" cy="10" r="3.4" fill="none" stroke="#f6b40e" stroke-width="1.6" stroke-dasharray="0.6 1.0"/>
    <circle cx="15" cy="10" r="2.0" fill="#f6b40e" stroke="#e0a008" stroke-width="0.3"/>
  </svg>
</div>

<div class="brand-title"><span class="nx">NX</span> <span class="nexo">NEXO-</span><span class="web">WEB</span></div>
<div class="subtitle">Diseño y desarrollo web</div>

<div class="play-hint">↻ Girar y jugar</div>
<a class="portfolio-btn" href="/portfolio#trabajos" onclick="try{sessionStorage.setItem('nexoIntro','1')}catch(e){}">Ver portafolio →</a>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

const LAV = 0xe9e6f7;
const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setClearColor(0x000000, 0);   // canvas 3D transparente → se ve el fondo animado detrás
renderer.setSize(innerWidth, innerHeight);
// En mobile (retina) limitar el pixel ratio evita render innecesario y lag
const coarse = matchMedia('(pointer:coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.5 : 2));   // resolución alta para que los celus se vean nítidos
const MAXA = renderer.capabilities.getMaxAnisotropy();   // anisotropía máxima del GPU para texturas nítidas en ángulo
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;   // sombras suaves y difuminadas
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// fondo transparente: se ve el fondo animado (background.js) detrás del 3D
scene.background = null;

// Entorno para reflejos realistas en el metal
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 9.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 16;
controls.target.set(0, 0, 0);

// ---- Giro de bienvenida: muestra el efecto 3D en 3 posiciones al entrar ----
let introActive = true;
const INTRO_DUR = 8.0;                 // segundos
const CAM_R = camera.position.z;       // radio (9.5)
const easeInOut = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
// Recorre: frente → derecha → izquierda → arriba → abajo → frente  [azimut, elevación]
const POSE = [[0,0],[-0.7,0],[0.7,0],[0,-0.85],[0,0.85],[0,0]];
function introPose(p){
  const n = POSE.length - 1;           // 5 segmentos
  const f = Math.min(p,1) * n;
  const i = Math.min(Math.floor(f), n-1);
  const q = easeInOut(f - i);
  const a = POSE[i], b = POSE[i+1];
  return [ a[0]+(b[0]-a[0])*q, a[1]+(b[1]-a[1])*q ];
}
function endIntro(){ if (introActive){ introActive = false; controls.enabled = true; controls.update(); } }
controls.enabled = false;              // el usuario toma el control al terminar (o al tocar)
renderer.domElement.addEventListener('pointerdown', endIntro, { once:true });

// ---- Luces (complementan el environment) ----
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 6, 6);
key.castShadow = true;
key.shadow.mapSize.set(coarse ? 512 : 1024, coarse ? 512 : 1024);   // sombra más liviana en celular
key.shadow.camera.near = 0.5; key.shadow.camera.far = 30;
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0006; key.shadow.radius = 8; key.shadow.blurSamples = coarse ? 4 : 8;
scene.add(key);

// Plano receptor de sombra (atrás) → profundidad suave, tintada al lavanda
const shadowCatcher = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 14),
  new THREE.ShadowMaterial({ color:0x2b2350, opacity:0.32 }));
shadowCatcher.position.set(0.3, -0.35, -1.6);
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);
const rim = new THREE.DirectionalLight(0xd7ccff, 0.8);
rim.position.set(-5, 2, -4);
scene.add(rim);

// ---- Materiales (iPhone 14 Pro Max · Gris/Silver) ----
const railMat   = new THREE.MeshStandardMaterial({ color:0xd0d0d6, metalness:0.55, roughness:0.42 });  // gris cepillado (detalles visibles)
const backMat   = new THREE.MeshPhysicalMaterial({ color:0xb6b6bf, metalness:0.0, roughness:0.42, clearcoat:0.7, clearcoatRoughness:0.32 });  // vidrio mate esmerilado con brillo suave
const logoMat   = new THREE.MeshPhysicalMaterial({ color:0xbcbcc4, metalness:0.0, roughness:0.12, clearcoat:1.0, clearcoatRoughness:0.06, side:THREE.DoubleSide });  // logo Apple glossy mismo tono (sutil)
const frontMat  = new THREE.MeshStandardMaterial({ color:0x0a0a0e, metalness:0.1, roughness:0.05 });  // vidrio frontal (bezel)
const ringMat   = new THREE.MeshStandardMaterial({ color:0x9a9aa3, metalness:1.0, roughness:0.24 });  // aro de lente
const lensMat   = new THREE.MeshPhysicalMaterial({ color:0x0a0a16, metalness:0.1, roughness:0.02, clearcoat:1.0, clearcoatRoughness:0.05 });
const flashMat  = new THREE.MeshStandardMaterial({ color:0xf2eccf, metalness:0.0, roughness:0.4, emissive:0x1a1810 });
const lidarMat  = new THREE.MeshStandardMaterial({ color:0x14141b, metalness:0.4, roughness:0.3 });
const islandMat = new THREE.MeshStandardMaterial({ color:0x050507, metalness:0.2, roughness:0.2 });

// ---- Logo de Apple (silueta real vía SVG) ----
const APPLE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 1000"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.2z"/></svg>`;

function makeAppleLogo(size){
  const data = new SVGLoader().parse(APPLE_SVG);
  const shapes = [];
  data.paths.forEach(p => p.toShapes(true).forEach(s => shapes.push(s)));
  const geo = new THREE.ShapeGeometry(shapes);
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const w = bb.max.x-bb.min.x, h = bb.max.y-bb.min.y;
  geo.translate(-(bb.min.x+w/2), -(bb.min.y+h/2), 0);
  const sc = size / h;
  geo.scale(-sc, -sc, sc);   // y: SVG va al revés · x: corrige el espejo al verlo desde atrás
  return new THREE.Mesh(geo, logoMat);
}

// Encuadre "cover": llena la pantalla sin deformar, recortando el sobrante
function applyCover(tex, mediaAspect, planeAspect){
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = MAXA;                          // máxima nitidez en ángulo
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter; // suave sin pixelar al alejarse
  tex.magFilter = THREE.LinearFilter;
  if (mediaAspect > planeAspect){           // media más ancho → recorta a los lados
    tex.repeat.set(planeAspect/mediaAspect, 1);
  } else {                                  // media más alto → recorta arriba/abajo
    tex.repeat.set(1, mediaAspect/planeAspect);
  }
  tex.offset.set((1-tex.repeat.x)/2, (1-tex.repeat.y)/2);
  tex.needsUpdate = true;
}

// Textura de pantalla (celu1/celu2): muestra la captura COMPLETA llenando la
// pantalla, como un celular de verdad (sin recorte). Alta calidad (anisotropía + mipmaps).
function makeScreenMaterial(src, planeAspect){
  const tex = new THREE.TextureLoader().load(src, t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = MAXA;
    t.generateMipmaps = true;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.magFilter = THREE.LinearFilter;
    applyCover(t, t.image.width / t.image.height, planeAspect);   // recorta para llenar el área (sin deformar)
  });
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = MAXA;
  applyCover(tex, 862 / 1824, planeAspect);
  const m = new THREE.MeshBasicMaterial({ map: tex, alphaMap: roundedAlpha, transparent: true });
  m.toneMapped = false;
  return m;
}

// Máscara de esquinas redondeadas (alphaMap) para la pantalla
function makeRoundedAlpha(){
  const c = document.createElement('canvas'); c.width = 280; c.height = 600;
  const x = c.getContext('2d');
  const r = 46;                          // radio de esquina
  x.fillStyle = '#fff';
  x.beginPath();
  x.moveTo(r,0);
  x.arcTo(c.width,0,c.width,c.height,r);
  x.arcTo(c.width,c.height,0,c.height,r);
  x.arcTo(0,c.height,0,0,r);
  x.arcTo(0,0,c.width,0,r);
  x.closePath(); x.fill();
  return new THREE.CanvasTexture(c);
}
const roundedAlpha = makeRoundedAlpha();

// Video completo (sin recorte) para encajar en un plano con su propio aspecto
function makeVideoTexture(){
  const video = document.createElement('video');
  video.src = 'telefono1.mp4';
  video.muted = true; video.loop = true; video.autoplay = true;
  video.playsInline = true; video.setAttribute('playsinline','');
  video.play().catch(()=>{});
  const tex = new THREE.VideoTexture(video);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Barra de estado tipo iPhone: hora · señal · wifi · batería (icónica, blanca)
function makeStatusBarTexture(){
  const c = document.createElement('canvas'); c.width = 600; c.height = 70;
  const x = c.getContext('2d');
  x.clearRect(0,0,600,70);
  x.fillStyle = '#fff'; x.strokeStyle = '#fff';
  x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 5;   // contraste sobre fondo claro u oscuro
  // hora
  x.font = '700 32px system-ui'; x.textBaseline = 'middle';
  x.fillText('9:41', 30, 36);
  // señal celular (4 barras)
  const sx = 422; [12,18,24,30].forEach((h,i)=> x.fillRect(sx+i*13, 38-h, 9, h));
  // wifi (abanico)
  const wx = 504, wy = 40; x.lineWidth = 5;
  [18,12,6].forEach(r=>{ x.beginPath(); x.arc(wx, wy, r, Math.PI*1.25, Math.PI*1.75); x.stroke(); });
  x.beginPath(); x.arc(wx, wy, 2.5, 0, Math.PI*2); x.fill();
  // batería
  x.lineWidth = 3; x.strokeRect(536, 22, 42, 24);
  x.fillRect(580, 29, 5, 10);     // terminal
  x.fillRect(540, 26, 32, 16);    // nivel de carga
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// Forma de rectángulo redondeado (esquinas continuas tipo iPhone)
function roundedRectShape(w,h,r){
  const s=new THREE.Shape(); const x=-w/2, y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);   s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);     s.quadraticCurveTo(x,y,x+r,y);
  return s;
}

// ---- iPhone 14 Pro Max (proporciones reales 160.7 × 77.6 × 7.85 mm) ----
function makePhone(variant){
  const g = new THREE.Group();
  const W = 1.5;
  const H = W * (160.7/77.6);   // ≈ 3.107
  const D = W * (7.85/77.6);    // ≈ 0.152
  const R = 0.30;               // radio de esquina continuo

  // Cuerpo / rieles planos de acero: extrusión con bisel chico → costados PLANOS (no redondeados)
  const bodyGeo = new THREE.ExtrudeGeometry(roundedRectShape(W,H,R),
    { depth:D, bevelEnabled:true, bevelThickness:0.025, bevelSize:0.025, bevelSegments:3, curveSegments:20 });
  bodyGeo.translate(0,0,-D/2);
  g.add(new THREE.Mesh(bodyGeo, railMat));

  // Vidrio trasero mate (inset → se ve el filo de acero alrededor)
  const backGeo = new THREE.ExtrudeGeometry(roundedRectShape(W-0.10,H-0.10,R-0.05),
    { depth:0.02, bevelEnabled:false, curveSegments:20 });
  backGeo.translate(0,0,-D/2-0.022);
  g.add(new THREE.Mesh(backGeo, backMat));

  // Vidrio frontal negro (bezel: apenas hundido, detrás de la pantalla)
  const frontGeo = new THREE.ExtrudeGeometry(roundedRectShape(W-0.05,H-0.05,R-0.02),
    { depth:0.012, bevelEnabled:false, curveSegments:20 });
  frontGeo.translate(0,0,D/2-0.006);
  const front = new THREE.Mesh(frontGeo, frontMat);
  front.renderOrder = 0;
  g.add(front);

  // ----- Pantalla -----
  const screenW = W-0.14, screenH = H-0.16;
  const screenZ = D/2 + 0.03;
  // Fondo negro de la pantalla = bisel del iPhone 14 (esquinas redondeadas + borde arriba/abajo)
  const screenBg = new THREE.Mesh(new THREE.PlaneGeometry(screenW, screenH),
    new THREE.MeshBasicMaterial({ color:0x000000, alphaMap: roundedAlpha, transparent:true }));
  screenBg.position.z = screenZ; screenBg.renderOrder = 1; g.add(screenBg);
  // Imagen recortada dejando borde negro arriba y abajo (como un iPhone 14 real)
  const borderV = screenH * 0.055;                 // borde negro superior e inferior
  const imgH = screenH - borderV * 2;
  const scrMat = makeScreenMaterial(variant === 'A' ? 'celu1.png' : 'celu2.png', screenW / imgH);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(screenW, imgH), scrMat);
  screen.position.set(0, 0, screenZ + 0.002); screen.renderOrder = 2; g.add(screen);

  // Barra de estado (hora · señal · wifi · batería) sobre la pantalla
  const sb = new THREE.Mesh(new THREE.PlaneGeometry(screenW, screenW*70/600),
    new THREE.MeshBasicMaterial({ map: makeStatusBarTexture(), transparent:true, depthWrite:false, toneMapped:false }));
  sb.position.set(0, H/2 - 0.30, screenZ + 0.02); sb.renderOrder = 4; g.add(sb);

  // Dynamic island (por encima de la pantalla)
  const island = new THREE.Mesh(roundedBox3D(0.36, 0.11, 0.02, 0.055), islandMat);
  island.position.set(0, H/2 - 0.30, D/2 + 0.05);
  g.add(island);

  // ---- Módulo de cámara (cuadrado, arriba-izquierda) ----
  const cx = -W/2 + 0.50, cy = H/2 - 0.58, zBack = -D/2 - 0.022;
  const plateGeo = new THREE.ExtrudeGeometry(roundedRectShape(0.78,0.78,0.22),
    { depth:0.05, bevelEnabled:true, bevelThickness:0.02, bevelSize:0.02, bevelSegments:2, curveSegments:16 });
  plateGeo.translate(0,0,-0.05);
  const plate = new THREE.Mesh(plateGeo, backMat);
  plate.position.set(cx, cy, zBack);
  g.add(plate);

  // 3 lentes en triángulo (dos arriba, una abajo-izquierda) con relieve realista
  const s = 0.19;
  [[-s, s], [s, s], [-s, -s]].forEach(([lx,ly])=>{
    const px = cx+lx, py = cy+ly;
    // aro metálico exterior
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.165,0.085,32), ringMat);
    ring.rotation.x = Math.PI/2; ring.position.set(px, py, zBack-0.085); g.add(ring);
    // recess negro (hueco)
    const recess = new THREE.Mesh(new THREE.CylinderGeometry(0.125,0.135,0.06,32), lidarMat);
    recess.rotation.x = Math.PI/2; recess.position.set(px, py, zBack-0.10); g.add(recess);
    // vidrio abombado (domo) que capta el reflejo
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(0.10, 24, 14, 0, Math.PI*2, 0, Math.PI/2), lensMat);
    dome.rotation.x = -Math.PI/2; dome.position.set(px, py, zBack-0.13); g.add(dome);
  });

  // Flash (abajo-derecha) y LiDAR (centro-derecha)
  const flash = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.05,20), flashMat);
  flash.rotation.x = Math.PI/2; flash.position.set(cx+s, cy-s, zBack-0.07); g.add(flash);
  const lidar = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.05,20), lidarMat);
  lidar.rotation.x = Math.PI/2; lidar.position.set(cx+s, cy, zBack-0.07); g.add(lidar);

  // Logo Apple real (silueta), pulido sutil, centrado atrás
  const logo = makeAppleLogo(0.46);
  logo.position.set(0, 0.05, zBack-0.004);
  logo.rotation.y = Math.PI;
  g.add(logo);

  // ---- Botones (acero) ----
  // Power (riel derecho)
  const power = new THREE.Mesh(roundedBox3D(0.05,0.55,0.11,0.025), railMat);
  power.position.set(W/2+0.005, 0.35, 0); g.add(power);
  // Acción + volumen +/- (riel izquierdo)
  const action = new THREE.Mesh(roundedBox3D(0.05,0.16,0.11,0.025), railMat);
  action.position.set(-W/2-0.005, 0.95, 0); g.add(action);
  [[0.50,0.34],[0.05,0.34]].forEach(([vy,vh])=>{
    const v = new THREE.Mesh(roundedBox3D(0.05,vh,0.11,0.025), railMat);
    v.position.set(-W/2-0.005, vy, 0); g.add(v);
  });

  // ---- Parte inferior: puerto de carga (USB-C) + parlantes ----
  // material de cavidad casi negro → marca profundidad contra el riel claro
  const deep = new THREE.MeshStandardMaterial({ color:0x070708, metalness:0.2, roughness:0.7 });
  // Puerto USB-C: grande, oscuro, sobresale del borde → bien visible desde abajo
  const port = new THREE.Mesh(roundedBox3D(0.40, 0.075, 0.11, 0.036), deep);
  port.position.set(0, -H/2 - 0.012, 0); g.add(port);
  // Parlantes: dos hileras de orificios oscuros marcados a cada lado del puerto
  for (const side of [-1, 1]){
    for (let k = 0; k < 4; k++){
      const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.08, 16), deep);
      hole.position.set(side * (0.30 + k*0.075), -H/2 - 0.012, 0); g.add(hole);
    }
  }

  return g;
}

// helper: caja redondeada (para botones, isla)
function roundedBox3D(w,h,d,r){ return new RoundedBoxGeometry(w,h,d,3,r); }

// ---- Dos teléfonos, apenas separados, inclinados opuestos ----
const phoneL = makePhone('A');
phoneL.position.set(-0.82, 0.15, 0);
phoneL.rotation.set(0.12, 0.5, 0.20);
scene.add(phoneL);

const phoneR = makePhone('B');
phoneR.position.set(0.82, -0.1, 0.2);
phoneR.rotation.set(-0.05, -0.55, -0.16);
scene.add(phoneR);

// Que ambos teléfonos proyecten sombra (profundidad)
[phoneL, phoneR].forEach(p => p.traverse(o => { if (o.isMesh) o.castShadow = true; }));

const rotLy = phoneL.rotation.y, rotRy = phoneR.rotation.y;


// ---- Animación: flotación suave contrafaseada ----
const clock = new THREE.Clock();
// ---- "Dive": al tocar Ver portafolio, la cámara entra al teléfono del video y funde a negro ----
let diving = false, diveDone = false, diveStart = 0;
const DIVE_DUR = 1.5;
const diveCam0 = new THREE.Vector3();
const divePPos0 = new THREE.Vector3();
const divePRot0 = new THREE.Euler();
const lerp = (a, b, t) => a + (b - a) * t;
const easeInDive = x => x * x * x;            // acelera al entrar

const fadeLayer = document.createElement('div');
fadeLayer.style.cssText = 'position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:10';
document.body.appendChild(fadeLayer);

function startDive(){
  if (diving) return;
  diving = true; introActive = false; controls.enabled = false;
  diveStart = clock.getElapsedTime();
  diveCam0.copy(camera.position);
  divePPos0.copy(phoneL.position);
  divePRot0.copy(phoneL.rotation);
  document.body.classList.add('diving');
}
function updateDive(){
  let p = (clock.getElapsedTime() - diveStart) / DIVE_DUR;
  if (p > 1) p = 1;
  const e = easeInDive(p);
  // enderezar y centrar el teléfono del video
  phoneL.position.set(lerp(divePPos0.x,0,e), lerp(divePPos0.y,0,e), lerp(divePPos0.z,0,e));
  phoneL.rotation.set(lerp(divePRot0.x,0,e), lerp(divePRot0.y,0,e), lerp(divePRot0.z,0,e));
  // la cámara se mete hacia la pantalla
  camera.position.set(lerp(diveCam0.x,0,e), lerp(diveCam0.y,0,e), lerp(diveCam0.z,0.34,e));
  camera.lookAt(0, 0, 0.1);
  // fundido a negro sobre el final
  fadeLayer.style.opacity = Math.max(0, (p - 0.6) / 0.4).toFixed(3);
  if (p >= 1 && !diveDone){
    diveDone = true;
    try { sessionStorage.setItem('nexoIntro','1'); } catch(e){}
    location.href = '/portfolio#trabajos';
  }
}

function animate(){
  requestAnimationFrame(animate);
  if (document.hidden) return;          // no renderizar con la pestaña oculta
  if (diving){ updateDive(); renderer.render(scene, camera); return; }
  const t = clock.getElapsedTime();
  // solo izquierda-derecha (giro sobre su eje), sin movimiento de arriba-abajo
  phoneL.rotation.y = rotLy + Math.sin(t*0.6) * 0.16;
  phoneR.rotation.y = rotRy + Math.sin(t*0.6 + Math.PI) * 0.16;
  if (introActive){
    const p = Math.min(t / INTRO_DUR, 1);
    const [az, el] = introPose(p);
    const ce = Math.cos(el), se = Math.sin(el);
    camera.position.set(CAM_R*ce*Math.sin(az), CAM_R*se, CAM_R*ce*Math.cos(az));
    camera.lookAt(0, 0, 0);
    if (p >= 1) endIntro();
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
}
animate();

// El botón "Ver portafolio" dispara el dive (con fallback al link si el 3D falla)
const verBtn = document.querySelector('.portfolio-btn');
if (verBtn) verBtn.addEventListener('click', e => { e.preventDefault(); startDive(); });

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
