<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXO/WEB — Portafolio 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#111; --cream:#f0ebdf; --pink:#ff2d8f; --lime:#c5f534; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#e9e6f7;
    font-family:"Space Mono",monospace}
  #app{position:fixed;inset:0}
  canvas{display:block;cursor:grab}
  canvas:active{cursor:grabbing}

  /* Título de la empresa (estilo brutalista NEXO/WEB) */
  .brand-title{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:3;
    display:flex;align-items:center;gap:13px;
    font-family:"Archivo Black",sans-serif;font-size:32px;letter-spacing:.01em;color:var(--ink)}
  .brand-title .nx{background:var(--pink);color:#fff;border:3px solid var(--ink);
    padding:3px 10px;font-size:25px;transform:rotate(-4deg)}      /* logo fucsia */
  .brand-title .nexo{color:var(--ink)}                            /* NEXO negro */
  .brand-title .web{background:var(--lime);color:var(--ink);
    padding:1px 9px;margin-left:2px;box-shadow:3px 3px 0 var(--ink)} /* WEB resaltado verde */

  /* Botón Ver portafolio */
  .portfolio-btn{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:3;
    font-family:"Space Mono",monospace;font-weight:700;font-size:16px;letter-spacing:.02em;
    background:var(--pink);color:#fff;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
    padding:14px 28px;text-decoration:none;display:inline-flex;align-items:center;gap:10px;
    transition:transform .12s ease, box-shadow .12s ease}
  .portfolio-btn:hover{transform:translateX(-50%) translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}

  .hint{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);
    z-index:2;color:#6b6488;font-size:12px;font-weight:400;
    background:rgba(255,255,255,.55);padding:6px 12px;border-radius:999px;
    backdrop-filter:blur(6px);pointer-events:none;transition:opacity .6s ease}
  .hint.gone{opacity:0}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div class="brand-title"><span class="nx">NX</span> <span class="nexo">NEXO-</span><span class="web">WEB</span></div>

<a class="portfolio-btn" href="portfolio.html#trabajos">Ver portafolio →</a>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

const LAV = 0xe9e6f7;
const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(LAV);

// Entorno para reflejos realistas en el metal
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 9.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 16;
controls.target.set(0, 0, 0);

// ---- Luces (complementan el environment) ----
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4, 6, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 30;
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0004; key.shadow.radius = 6;
scene.add(key);

// Plano receptor de sombra (atrás) → da profundidad sin verse el plano
const shadowCatcher = new THREE.Mesh(
  new THREE.PlaneGeometry(16, 12),
  new THREE.ShadowMaterial({ opacity:0.28 }));
shadowCatcher.position.set(0, -0.2, -1.4);
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);
const rim = new THREE.DirectionalLight(0xd7ccff, 0.8);
rim.position.set(-5, 2, -4);
scene.add(rim);

// ---- Materiales (iPhone 14 Pro Max · Gris/Silver) ----
const railMat   = new THREE.MeshStandardMaterial({ color:0xd0d0d6, metalness:0.55, roughness:0.42 });  // gris cepillado (detalles visibles)
const backMat   = new THREE.MeshPhysicalMaterial({ color:0xb6b6bf, metalness:0.0, roughness:0.42, clearcoat:0.7, clearcoatRoughness:0.32 });  // vidrio mate esmerilado con brillo suave
const logoMat   = new THREE.MeshPhysicalMaterial({ color:0xbcbcc4, metalness:0.0, roughness:0.12, clearcoat:1.0, clearcoatRoughness:0.06, side:THREE.DoubleSide });  // logo Apple glossy mismo tono (sutil)
const frontMat  = new THREE.MeshStandardMaterial({ color:0x0a0a0e, metalness:0.1, roughness:0.05 });  // vidrio frontal (bezel)
const ringMat   = new THREE.MeshStandardMaterial({ color:0x9a9aa3, metalness:1.0, roughness:0.24 });  // aro de lente
const lensMat   = new THREE.MeshPhysicalMaterial({ color:0x0a0a16, metalness:0.1, roughness:0.02, clearcoat:1.0, clearcoatRoughness:0.05 });
const flashMat  = new THREE.MeshStandardMaterial({ color:0xf2eccf, metalness:0.0, roughness:0.4, emissive:0x1a1810 });
const lidarMat  = new THREE.MeshStandardMaterial({ color:0x14141b, metalness:0.4, roughness:0.3 });
const islandMat = new THREE.MeshStandardMaterial({ color:0x050507, metalness:0.2, roughness:0.2 });

// ---- Logo de Apple (silueta real vía SVG) ----
const APPLE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 1000"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.2z"/></svg>`;

function makeAppleLogo(size){
  const data = new SVGLoader().parse(APPLE_SVG);
  const shapes = [];
  data.paths.forEach(p => p.toShapes(true).forEach(s => shapes.push(s)));
  const geo = new THREE.ShapeGeometry(shapes);
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const w = bb.max.x-bb.min.x, h = bb.max.y-bb.min.y;
  geo.translate(-(bb.min.x+w/2), -(bb.min.y+h/2), 0);
  const sc = size / h;
  geo.scale(-sc, -sc, sc);   // y: SVG va al revés · x: corrige el espejo al verlo desde atrás
  return new THREE.Mesh(geo, logoMat);
}

// Encuadre "cover": llena la pantalla sin deformar, recortando el sobrante
function applyCover(tex, mediaAspect, planeAspect){
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  if (mediaAspect > planeAspect){           // media más ancho → recorta a los lados
    tex.repeat.set(planeAspect/mediaAspect, 1);
  } else {                                  // media más alto → recorta arriba/abajo
    tex.repeat.set(1, mediaAspect/planeAspect);
  }
  tex.offset.set((1-tex.repeat.x)/2, (1-tex.repeat.y)/2);
  tex.needsUpdate = true;
}

// Textura de imagen (pantalla derecha) con encuadre cover
function makeScreenMaterial(variant, planeAspect){
  const tex = new THREE.TextureLoader().load('telefono2.png',
    t => applyCover(t, t.image.width/t.image.height, planeAspect));
  applyCover(tex, 853/1844, planeAspect);
  const m = new THREE.MeshBasicMaterial({ map: tex, alphaMap: roundedAlpha, transparent: true });
  m.toneMapped = false;
  return m;
}

// Máscara de esquinas redondeadas (alphaMap) para la pantalla
function makeRoundedAlpha(){
  const c = document.createElement('canvas'); c.width = 280; c.height = 600;
  const x = c.getContext('2d');
  const r = 46;                          // radio de esquina
  x.fillStyle = '#fff';
  x.beginPath();
  x.moveTo(r,0);
  x.arcTo(c.width,0,c.width,c.height,r);
  x.arcTo(c.width,c.height,0,c.height,r);
  x.arcTo(0,c.height,0,0,r);
  x.arcTo(0,0,c.width,0,r);
  x.closePath(); x.fill();
  return new THREE.CanvasTexture(c);
}
const roundedAlpha = makeRoundedAlpha();

// Video completo (sin recorte) para encajar en un plano con su propio aspecto
function makeVideoTexture(){
  const video = document.createElement('video');
  video.src = 'telefono1.mp4';
  video.muted = true; video.loop = true; video.autoplay = true;
  video.playsInline = true; video.setAttribute('playsinline','');
  video.play().catch(()=>{});
  const tex = new THREE.VideoTexture(video);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Barra de estado tipo iPhone: hora · señal · wifi · batería (icónica, blanca)
function makeStatusBarTexture(){
  const c = document.createElement('canvas'); c.width = 600; c.height = 70;
  const x = c.getContext('2d');
  x.clearRect(0,0,600,70);
  x.fillStyle = '#fff'; x.strokeStyle = '#fff';
  x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 5;   // contraste sobre fondo claro u oscuro
  // hora
  x.font = '700 32px system-ui'; x.textBaseline = 'middle';
  x.fillText('9:41', 30, 36);
  // señal celular (4 barras)
  const sx = 422; [12,18,24,30].forEach((h,i)=> x.fillRect(sx+i*13, 38-h, 9, h));
  // wifi (abanico)
  const wx = 504, wy = 40; x.lineWidth = 5;
  [18,12,6].forEach(r=>{ x.beginPath(); x.arc(wx, wy, r, Math.PI*1.25, Math.PI*1.75); x.stroke(); });
  x.beginPath(); x.arc(wx, wy, 2.5, 0, Math.PI*2); x.fill();
  // batería
  x.lineWidth = 3; x.strokeRect(536, 22, 42, 24);
  x.fillRect(580, 29, 5, 10);     // terminal
  x.fillRect(540, 26, 32, 16);    // nivel de carga
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ---- Pantalla mock dibujada en canvas ----
function makeScreenTexture(variant){
  const c = document.createElement('canvas'); c.width = 540; c.height = 1170;
  const x = c.getContext('2d');
  const W = c.width, H = c.height;
  // fondo
  x.fillStyle = variant==='B' ? '#f3f1fb' : '#ffffff'; x.fillRect(0,0,W,H);
  // status bar
  x.fillStyle = '#1d1b2e'; x.font = 'bold 26px system-ui';
  x.fillText('11:39', 40, 60);
  // header logo
  x.fillStyle = '#6c4cf1'; x.beginPath(); x.arc(60, 150, 12, 0, 7); x.fill();
  x.fillStyle = '#1d1b2e'; x.font = 'bold 30px system-ui'; x.fillText('fiveriver', 84, 160);
  // botón circular violeta (der)
  x.fillStyle = '#6c4cf1'; x.beginPath(); x.arc(W-70, 150, 26, 0, 7); x.fill();

  const rr=(px,py,w,h,r)=>{x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);
    x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();};

  if(variant==='B'){
    // tarjeta violeta
    x.fillStyle='#6c4cf1'; rr(40,230,460,150,26); x.fill();
    x.fillStyle='rgba(255,255,255,.9)'; x.font='bold 26px system-ui';
    x.fillText('Interactividad', 70, 290); x.fillText('real', 70, 326);
    // tarjeta blanca
    x.fillStyle='#fff'; x.shadowColor='rgba(90,70,160,.18)'; x.shadowBlur=20;
    rr(40,410,460,170,26); x.fill(); x.shadowBlur=0;
    x.fillStyle='#cfc8ea'; rr(70,450,300,16,8); x.fill(); rr(70,486,360,16,8); x.fill(); rr(70,522,220,16,8); x.fill();
    // heading
    x.fillStyle='#1d1b2e'; x.font='bold 40px system-ui';
    x.fillText('Sin importar', 70, 700); x.fillText('tu ', 70, 750);
    x.fillStyle='#6c4cf1'; x.fillText('nivel', 120, 750);
    // footer
    x.fillStyle='#8a86a0'; x.font='22px system-ui'; x.fillText('Clases online · cuando quieras', 70, H-60);
  } else {
    // heading
    x.fillStyle='#1d1b2e'; x.font='bold 44px system-ui';
    x.fillText('Empezá a ', 40, 280);
    x.fillStyle='#6c4cf1'; x.fillText('hablar', 250, 280);
    x.fillStyle='#1d1b2e'; x.fillText('en 10 días', 40, 336);
    // párrafo
    x.fillStyle='#6b6880'; x.font='24px system-ui';
    x.fillText('Clases interactivas basadas', 40, 410);
    x.fillText('en situaciones reales.', 40, 446);
    // CTA verde
    x.fillStyle='#c8f56a'; rr(40,500,460,90,24); x.fill();
    x.fillStyle='#1d1b2e'; x.font='bold 28px system-ui'; x.fillText('Empezar ahora', 150, 558);
    // foto
    const g=x.createLinearGradient(40,640,500,900); g.addColorStop(0,'#c9c4e6'); g.addColorStop(1,'#a89fd8');
    x.fillStyle=g; rr(40,640,460,300,26); x.fill();
    x.fillStyle='#8a86a0'; x.font='22px system-ui'; x.fillText('Clases online · cuando quieras', 70, H-60);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// Forma de rectángulo redondeado (esquinas continuas tipo iPhone)
function roundedRectShape(w,h,r){
  const s=new THREE.Shape(); const x=-w/2, y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);   s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);     s.quadraticCurveTo(x,y,x+r,y);
  return s;
}

// ---- iPhone 14 Pro Max (proporciones reales 160.7 × 77.6 × 7.85 mm) ----
function makePhone(variant){
  const g = new THREE.Group();
  const W = 1.5;
  const H = W * (160.7/77.6);   // ≈ 3.107
  const D = W * (7.85/77.6);    // ≈ 0.152
  const R = 0.30;               // radio de esquina continuo

  // Cuerpo / rieles planos de acero: extrusión con bisel chico → costados PLANOS (no redondeados)
  const bodyGeo = new THREE.ExtrudeGeometry(roundedRectShape(W,H,R),
    { depth:D, bevelEnabled:true, bevelThickness:0.025, bevelSize:0.025, bevelSegments:3, curveSegments:32 });
  bodyGeo.translate(0,0,-D/2);
  g.add(new THREE.Mesh(bodyGeo, railMat));

  // Vidrio trasero mate (inset → se ve el filo de acero alrededor)
  const backGeo = new THREE.ExtrudeGeometry(roundedRectShape(W-0.10,H-0.10,R-0.05),
    { depth:0.02, bevelEnabled:false, curveSegments:32 });
  backGeo.translate(0,0,-D/2-0.022);
  g.add(new THREE.Mesh(backGeo, backMat));

  // Vidrio frontal negro (bezel: apenas hundido, detrás de la pantalla)
  const frontGeo = new THREE.ExtrudeGeometry(roundedRectShape(W-0.05,H-0.05,R-0.02),
    { depth:0.012, bevelEnabled:false, curveSegments:32 });
  frontGeo.translate(0,0,D/2-0.006);
  const front = new THREE.Mesh(frontGeo, frontMat);
  front.renderOrder = 0;
  g.add(front);

  // ----- Pantalla -----
  const screenW = W-0.14, screenH = H-0.16;
  const screenZ = D/2 + 0.03;
  if (variant === 'A'){
    // Fondo negro + video COMPLETO sin recortar (encaja al ancho, barras arriba/abajo)
    const bg = new THREE.Mesh(new THREE.PlaneGeometry(screenW, screenH),
      new THREE.MeshBasicMaterial({ color:0x000000, alphaMap: roundedAlpha, transparent:true }));
    bg.position.z = screenZ; bg.renderOrder = 1; g.add(bg);
    const vA = 480/832;
    let vw = screenW, vh = screenW / vA;
    if (vh > screenH){ vh = screenH; vw = screenH * vA; }
    const vmat = new THREE.MeshBasicMaterial({ map: makeVideoTexture() });
    vmat.toneMapped = false;
    const vid = new THREE.Mesh(new THREE.PlaneGeometry(vw, vh), vmat);
    vid.position.set(0, 0, screenZ + 0.002); vid.renderOrder = 2; g.add(vid);
  } else {
    const scrMat = makeScreenMaterial('B', screenW/screenH);
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(screenW, screenH), scrMat);
    screen.position.z = screenZ; screen.renderOrder = 1; g.add(screen);
  }

  // Barra de estado (hora · señal · wifi · batería) sobre la pantalla
  const sb = new THREE.Mesh(new THREE.PlaneGeometry(screenW, screenW*70/600),
    new THREE.MeshBasicMaterial({ map: makeStatusBarTexture(), transparent:true, depthWrite:false, toneMapped:false }));
  sb.position.set(0, H/2 - 0.30, screenZ + 0.02); sb.renderOrder = 4; g.add(sb);

  // Dynamic island (por encima de la pantalla)
  const island = new THREE.Mesh(roundedBox3D(0.36, 0.11, 0.02, 0.055), islandMat);
  island.position.set(0, H/2 - 0.30, D/2 + 0.05);
  g.add(island);

  // ---- Módulo de cámara (cuadrado, arriba-izquierda) ----
  const cx = -W/2 + 0.50, cy = H/2 - 0.58, zBack = -D/2 - 0.022;
  const plateGeo = new THREE.ExtrudeGeometry(roundedRectShape(0.78,0.78,0.22),
    { depth:0.05, bevelEnabled:true, bevelThickness:0.02, bevelSize:0.02, bevelSegments:2, curveSegments:24 });
  plateGeo.translate(0,0,-0.05);
  const plate = new THREE.Mesh(plateGeo, backMat);
  plate.position.set(cx, cy, zBack);
  g.add(plate);

  // 3 lentes en triángulo (dos arriba, una abajo-izquierda) con relieve realista
  const s = 0.19;
  [[-s, s], [s, s], [-s, -s]].forEach(([lx,ly])=>{
    const px = cx+lx, py = cy+ly;
    // aro metálico exterior
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.165,0.085,48), ringMat);
    ring.rotation.x = Math.PI/2; ring.position.set(px, py, zBack-0.085); g.add(ring);
    // recess negro (hueco)
    const recess = new THREE.Mesh(new THREE.CylinderGeometry(0.125,0.135,0.06,48), lidarMat);
    recess.rotation.x = Math.PI/2; recess.position.set(px, py, zBack-0.10); g.add(recess);
    // vidrio abombado (domo) que capta el reflejo
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(0.10, 40, 28, 0, Math.PI*2, 0, Math.PI/2), lensMat);
    dome.rotation.x = -Math.PI/2; dome.position.set(px, py, zBack-0.13); g.add(dome);
  });

  // Flash (abajo-derecha) y LiDAR (centro-derecha)
  const flash = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.05,24), flashMat);
  flash.rotation.x = Math.PI/2; flash.position.set(cx+s, cy-s, zBack-0.07); g.add(flash);
  const lidar = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.05,24), lidarMat);
  lidar.rotation.x = Math.PI/2; lidar.position.set(cx+s, cy, zBack-0.07); g.add(lidar);

  // Logo Apple real (silueta), pulido sutil, centrado atrás
  const logo = makeAppleLogo(0.46);
  logo.position.set(0, 0.05, zBack-0.004);
  logo.rotation.y = Math.PI;
  g.add(logo);

  // ---- Botones (acero) ----
  // Power (riel derecho)
  const power = new THREE.Mesh(roundedBox3D(0.05,0.55,0.11,0.025), railMat);
  power.position.set(W/2+0.005, 0.35, 0); g.add(power);
  // Acción + volumen +/- (riel izquierdo)
  const action = new THREE.Mesh(roundedBox3D(0.05,0.16,0.11,0.025), railMat);
  action.position.set(-W/2-0.005, 0.95, 0); g.add(action);
  [[0.50,0.34],[0.05,0.34]].forEach(([vy,vh])=>{
    const v = new THREE.Mesh(roundedBox3D(0.05,vh,0.11,0.025), railMat);
    v.position.set(-W/2-0.005, vy, 0); g.add(v);
  });

  return g;
}

// helper: caja redondeada (para botones, isla)
function roundedBox3D(w,h,d,r){ return new RoundedBoxGeometry(w,h,d,3,r); }

// ---- Dos teléfonos, apenas separados, inclinados opuestos ----
const phoneL = makePhone('A');
phoneL.position.set(-0.82, 0.15, 0);
phoneL.rotation.set(0.12, 0.5, 0.20);
scene.add(phoneL);

const phoneR = makePhone('B');
phoneR.position.set(0.82, -0.1, 0.2);
phoneR.rotation.set(-0.05, -0.55, -0.16);
scene.add(phoneR);

// Que ambos teléfonos proyecten sombra (profundidad)
[phoneL, phoneR].forEach(p => p.traverse(o => { if (o.isMesh) o.castShadow = true; }));

const baseL = phoneL.position.y, baseR = phoneR.position.y;
const rotLz = phoneL.rotation.z, rotRz = phoneR.rotation.z;


// ---- Animación: flotación suave contrafaseada ----
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  phoneL.position.y = baseL + Math.sin(t*0.9) * 0.10;
  phoneR.position.y = baseR + Math.sin(t*0.9 + Math.PI) * 0.09;
  phoneL.rotation.z = rotLz + Math.sin(t*0.7) * 0.03;
  phoneR.rotation.z = rotRz + Math.sin(t*0.7 + Math.PI) * 0.03;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
